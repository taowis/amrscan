      - 0006 Caller wrapper: decisions/0006-caller-wrapper.md
      - 0007 nf-core conventions: decisions/0007-nf-core-conventions.md
      - 0008 Gadi runs: decisions/0008-gadi-runs.md
  - E. coli study:
