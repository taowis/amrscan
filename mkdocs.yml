site_name: AMRScan
site_description: AMRFinderPlus with provenance, as a Nextflow pipeline
repo_url: https://github.com/taowis/amrscan
docs_dir: docs
theme:
  name: material
  features:
    - navigation.sections
    - content.code.copy
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - tables
validation:
  omitted_files: info
  absolute_links: info
  unrecognized_links: info
  links:
    not_found: info
