name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lightweight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: nf-core/setup-nextflow@v2
        with:
          version: '25.04.6'
      - name: Fetch the nf-schema plugin (the tests run Nextflow offline)
        run: nextflow plugin install nf-schema@2.5.1
      - name: Unit and regression tests with branch coverage
        run: |
          python -m pip install coverage==7.10.6 numpy==2.3.3 scipy==1.16.2 scikit-learn==1.7.2 sourmash==4.9.4
          python -m coverage run --branch --source=bin -m unittest discover -s tests -p 'test_*.py' -v
          python -m coverage report --show-missing --fail-under=90
      - name: Workflow compilation, input validation and fixture harmonization
        run: python -m unittest discover -s tests -p test_nextflow.py -v
      - name: Diff whitespace
        run: git diff --check

  nf-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: nf-core/setup-nextflow@v2
        with:
          version: '25.04.6'
      - uses: nf-core/setup-nf-test@v1
        with:
          version: '0.9.2'
      - name: Cache the pinned AMRFinderPlus database
        uses: actions/cache@v4
        with:
          path: db/amrfinderplus
          key: amrfinderplus-db-2026-08-07.1-${{ hashFiles('scripts/fetch_amrfinder_db.sh') }}
      - name: Fetch and index the database
        run: scripts/fetch_amrfinder_db.sh --engine docker 2026-08-07.1 db/amrfinderplus
      - name: nf-test with Docker
        run: nf-test test --profile docker --ci
      - name: Test profile end to end
        run: |
          nextflow run main.nf -profile test,docker
          grep -q blaTEM-1 results/test/harmonized/blaTEM-1_NG_050145.1.amr.tsv

  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the documentation site
        run: |
          python -m pip install mkdocs-material==9.6.14
          mkdocs build --strict
